name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the version was raised
        # Every change shows up on the phone as a new "v x.y.z": bump major for big
        # changes, minor for new features, patch for fixes (see README).
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          node -e '
            const [base, head] = [process.argv[1], require("./package.json").version]
            const n = (v) => v.split(".").map(Number)
            const [a, b] = [n(base), n(head)]
            const raised = b[0] - a[0] || b[1] - a[1] || b[2] - a[2]
            if (!(raised > 0)) { console.error(`package.json version must go above ${base} (it is ${head})`); process.exit(1) }
            console.log(`version ${base} -> ${head}`)
          ' "$(git show FETCH_HEAD:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0)).version')"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/push
      - run: deno check --config supabase/functions/login/deno.json supabase/functions/login/index.ts
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
